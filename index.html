<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f7fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="출조체크" />
  <meta name="description" content="피캠스 출조 물때·날씨 - 전국 항구 물때, 조석, 날씨, 바람, 돌풍, 파고, 강수" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="manifest.webmanifest?v=14" />
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=14" />
  <link rel="icon" href="icons/icon-192.png?v=14" />
  <link rel="stylesheet" href="styles.css?v=14.0.0" />
  <title>피캠스 출조체크</title>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="title-wrap">
      <div class="brand">FICAMX</div>
      <h1>출조 물때·날씨</h1>
    </div>
    <button id="installBtn" class="install-btn" type="button">홈화면 설치</button>
  </header>

  <main>
    <section class="port-bar panel">
      <button id="portToggle" class="port-select" type="button" aria-label="항구 선택">
        <span id="selectedPortLabel" class="port-name">영목항</span>
        <span class="chev" aria-hidden="true">▾</span>
      </button>
      <div class="port-tools">
        <button id="searchPortBtn" class="tool-btn search-tool" type="button" aria-label="항구 검색">⌕</button>
        <button id="favoriteBtn" class="tool-btn star" type="button" aria-label="즐겨찾기">☆</button>
      </div>
    </section>

    <section class="date-panel panel" aria-label="날짜 선택">
      <button id="prevDateBtn" class="date-step up" type="button" aria-label="전날">▲</button>
      <div class="date-center-row">
        <button id="datePickerBtn" class="date-main" type="button" aria-label="년 월 일 선택">
          <span id="selectedDateLong" class="date-text"></span>
          <span id="lunarDate" class="lunar-inline"></span>
          <span class="date-drop" aria-hidden="true">▼</span>
        </button>
        <button id="calendarBtn" class="calendar-inline-btn" type="button" aria-label="달력 열기">🗓</button>
      </div>
      <button id="nextDateBtn" class="date-step down" type="button" aria-label="다음날">▼</button>
    </section>

    <section id="statusBanner" class="status hidden"></section>

    <section class="tide-card panel">
      <div class="water-row">
        <div class="water-title"><strong id="tideName">-</strong></div>
        <div class="flow-pill"><span>물흐름</span><strong id="flowPercent">-%</strong></div>
      </div>
      <div id="tideEvents" class="tide-strip"></div>
    </section>

    <section class="weather-section panel">
      <div class="weather-head">
        <strong>날씨 · 바람 · 파고 · 강수</strong>
        <div class="weather-nav" aria-label="시간대 이동">
          <button id="weatherPrevBtn" class="weather-nav-btn" type="button" aria-label="이전 시간대">‹</button>
          <button id="weatherNextBtn" class="weather-nav-btn" type="button" aria-label="다음 시간대">›</button>
        </div>
      </div>
      <div class="weather-scroll" id="weatherScroll">
        <div id="weatherGrid" class="weather-grid"></div>
      </div>
    </section>
  </main>
</div>

<!-- 항구 선택 바텀시트 -->
<div id="portSheet" class="sheet-backdrop hidden" aria-hidden="true">
  <section id="portPanel" class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="portSheetTitle">
    <div id="sheetDragZone" class="sheet-top-zone">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-title-row"><h2 id="portSheetTitle">항구 선택</h2><button id="closePortSheet" class="sheet-close" type="button">닫기</button></div>
    </div>
    <div class="sheet-search-sticky">
      <div class="search-box"><span>⌕</span><input id="portSearch" type="search" inputmode="search" enterkeyhint="search" placeholder="항구명 검색" autocomplete="off" /></div>
      <div id="regionFilters" class="region-filters"></div>
      <div id="favoriteSection" class="favorite-section"></div>
    </div>
    <div id="portList" class="port-list"></div>
  </section>
</div>

<!-- iPhone 알람식 날짜 룰렛 -->
<div id="dateWheelSheet" class="sheet-backdrop hidden" aria-hidden="true">
  <section id="dateWheelPanel" class="sheet-panel wheel-panel" role="dialog" aria-modal="true" aria-labelledby="dateWheelTitle">
    <div id="dateWheelDragZone" class="sheet-top-zone">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-title-row"><h2 id="dateWheelTitle">날짜 선택</h2><button id="closeDateWheel" class="sheet-close" type="button">닫기</button></div>
    </div>
    <div class="wheel-picker" aria-label="년 월 일 룰렛 선택">
      <div class="wheel-highlight" aria-hidden="true"></div>
      <div class="wheel-col">
        <div class="wheel-col-title">년</div>
        <div id="wheelYear" class="wheel-scroller" role="listbox"></div>
      </div>
      <div class="wheel-col">
        <div class="wheel-col-title">월</div>
        <div id="wheelMonth" class="wheel-scroller" role="listbox"></div>
      </div>
      <div class="wheel-col">
        <div class="wheel-col-title">일</div>
        <div id="wheelDay" class="wheel-scroller" role="listbox"></div>
      </div>
    </div>
    <div class="wheel-actions">
      <button id="wheelTodayBtn" class="wheel-secondary" type="button">오늘</button>
      <button id="wheelApplyBtn" class="wheel-primary" type="button">선택</button>
    </div>
  </section>
</div>


<!-- 달력: 각 날짜 아래 물때 / 물흐름 표시 -->
<div id="calendarOverlay" class="calendar-overlay hidden" aria-hidden="true">
  <section class="calendar-card" role="dialog" aria-modal="true" aria-labelledby="calendarTitle">
    <div class="calendar-head">
      <button id="calendarPrevMonth" class="calendar-nav" type="button" aria-label="이전 달">‹</button>
      <strong id="calendarTitle"></strong>
      <button id="calendarNextMonth" class="calendar-nav" type="button" aria-label="다음 달">›</button>
    </div>
    <div class="calendar-week"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div>
    <div id="calendarGrid" class="calendar-grid"></div>
    <div class="calendar-foot">
      <button id="calendarToday" class="calendar-today" type="button">오늘</button>
      <button id="calendarClose" class="calendar-close" type="button">닫기</button>
    </div>
  </section>
</div>

<dialog id="installDialog" class="dialog">
  <div class="dialog-body">
    <h2>홈 화면에 설치</h2>
    <p id="installGuide"></p>
    <button id="closeInstallDialog" class="wide-btn" type="button">확인</button>
  </div>
</dialog>

<script src="app.js?v=14.0.0"></script>
</body>
</html>
