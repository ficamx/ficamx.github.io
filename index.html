<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#f5f7fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="출조체크" />
  <meta name="description" content="피캠스 출조 물때·날씨 - 전국 조석예보지점, 날씨, 바람, 파고, 강수" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>피캠스 출조체크</title>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="title-wrap"><div class="brand">FICAMX</div><h1>출조 물때·날씨</h1></div>
    <div class="top-actions"><button id="settingsBtn" class="round-btn" aria-label="설정">⚙</button><button id="installBtn" class="install-btn">홈화면 설치</button></div>
  </header>

  <main>
    <section class="port-bar panel">
      <button id="portToggle" class="port-select" type="button"><strong id="selectedPortLabel">영목항</strong><span class="chev">⌄</span></button>
      <div class="port-tools"><button id="searchPortBtn" class="tool-btn" aria-label="항구 검색">⌕</button><button id="favoriteBtn" class="tool-btn star" aria-label="즐겨찾기">☆</button></div>
    </section>

    <section class="date-line panel">
      <div id="selectedDateLong" class="date-text"></div>
      <label class="calendar-btn" aria-label="날짜 선택"><span>▣</span><input id="datePicker" type="date" /></label>
    </section>

    <section id="statusBanner" class="status hidden"></section>

    <section class="tide-card panel">
      <div class="water-row"><div class="water-title"><strong id="tideName">-</strong><span id="lunarDate"></span></div><div class="flow-pill"><span>물흐름</span><strong id="flowPercent">-%</strong></div></div>
      <div id="tideStationLabel" class="station-line"></div>
      <div id="tideEvents" class="tide-strip"></div>
    </section>

    <section class="weather-section panel">
      <div class="weather-head"><strong>날씨 · 바람 · 파고 · 강수</strong><span>3시간 간격 · 좌우로 밀기</span></div>
      <div id="hourlyWeather" class="weather-scroll"></div>
    </section>
  </main>
</div>

<dialog id="portDialog" class="sheet">
  <div class="sheet-body">
    <div class="sheet-handle"></div>
    <div class="sheet-title-row"><h2>항구 선택</h2><button id="closePortDialog" class="sheet-close">닫기</button></div>
    <div class="search-box"><span>⌕</span><input id="portSearch" type="search" placeholder="항구명 검색" autocomplete="off" /></div>
    <div id="regionFilters" class="region-filters"></div>
    <div id="favoriteSection" class="favorite-section"></div>
    <div id="portList" class="port-list"></div>
  </div>
</dialog>

<dialog id="settingsDialog" class="dialog"><div class="dialog-body">
  <h2>설정</h2>
  <p>공식 조석 데이터는 GitHub에서 자동 갱신됩니다. 공유받은 사용자는 인증키를 입력하지 않아도 됩니다.</p>
  <button id="refreshBtn" class="wide-btn">데이터 새로고침</button>
  <button id="resetFavoritesBtn" class="wide-btn secondary">즐겨찾기 초기화</button>
  <button id="closeSettingsDialog" class="text-btn">닫기</button>
</div></dialog>

<dialog id="installDialog" class="dialog"><div class="dialog-body"><h2>홈 화면에 설치</h2><p id="installGuide"></p><button id="closeInstallDialog" class="wide-btn">확인</button></div></dialog>
<script src="app.js"></script>
</body>
</html>
